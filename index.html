<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Srini Finance Tracker</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#f8fafc",
                        "surface": "#ffffff",
                        "surface-variant": "#f1f5f9",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f8fafc",
                        "surface-container": "#f1f5f9",
                        "surface-container-high": "#e2e8f0",
                        "surface-container-highest": "#cbd5e1",
                        "on-background": "#0f172a",
                        "on-surface": "#0f172a",
                        "on-surface-variant": "#475569",
                        "primary": "#2563eb",
                        "on-primary": "#ffffff",
                        "primary-container": "#eff6ff",
                        "on-primary-container": "#1e3a8a",
                        "secondary": "#059669",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#d1fae5",
                        "on-secondary-container": "#064e3b",
                        "tertiary": "#8b5cf6",

                        "error": "#e11d48",
                        "on-error": "#ffffff",
                        "error-container": "#ffe4e6",
                        "on-error-container": "#881337",
                        "outline": "#94a3b8",
                        "outline-variant": "#e2e8f0"
                    },
                    "fontFamily": {
                        "sans": ["Inter", "sans-serif"],
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "outfit": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    "boxShadow": {
                        "glass": "0 8px 32px 0 rgba(31, 38, 135, 0.05)",
                        "glass-hover": "0 12px 40px 0 rgba(31, 38, 135, 0.1)"
                    }
                }
            }
        }
    </script>
  </head>
  <body class="bg-background text-on-surface min-h-screen pb-32 selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
